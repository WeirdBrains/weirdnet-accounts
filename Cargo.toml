[package]
name = "weirdnet-accounts"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet accounts: Argon2id passwords, hashed tokens, name rules, rate limits and org-scoped API keys, plus multi-tenant accounts with weirdnet-access roles, invitations, revocations and one authorization hook, over a storage trait with an optional SQLCipher store."
authors = ["Weird Brains LLC"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-accounts"
documentation = "https://docs.rs/weirdnet-accounts"
readme = "README.md"
keywords = ["accounts", "argon2", "api-keys", "authorization", "weirdnet"]
categories = ["authentication"]
include = ["src/**", "README.md", "SECURITY.md", "CHANGELOG.md", "LICENSE"]

[features]
default = []
# `SqliteStore`: the accounts store in its own SQLCipher database (weirdnet-storage).
sqlite = ["dep:weirdnet-storage", "dep:serde_json"]
# Build SQLCipher's OpenSSL from source (no system OpenSSL needed).
vendored-openssl = ["sqlite", "weirdnet-storage/vendored-openssl"]
# `net`: signed weirdnet-net memberships and revocations, and callers from node certs.
net = ["dep:weirdnet-net", "dep:serde_json"]
# `ServiceAuth`: a weirdnet-service `Authorize` hook over the accounts store.
service = ["net", "dep:weirdnet-service"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
subtle = "2"
ipnet = "2"
weirdnet-access = "0.1.2"
weirdnet-storage = { version = "0.1.1", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
weirdnet-net = { version = "0.8.2", optional = true }
weirdnet-service = { version = "0.1.0", default-features = false, features = ["net"], optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
